[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-outbox"
version = "0.1.0"
description = "The Outbox for Orchestra: drafts that machines write and the owner approves before anything is sent as the owner, with per-kind autonomy, per-recipient limits, senders per system and a metadata-only audit on the bus."
requires-python = ">=3.12"
dependencies = ["orchestra @ git+https://github.com/danroblewis/orchestra@main", "fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
orchestra-outbox = "orchestra_outbox.check:main"

[project.entry-points."orchestra.plugins"]
outbox = "orchestra_outbox.plugin:plugin"

[tool.hatch.metadata]
allow-direct-references = true   # Orchestra comes from GitHub (see README, "Developing against a local Orchestra")

[tool.hatch.build.targets.wheel]
packages = ["orchestra_outbox"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests"]          # the tests import conftest and the fakes

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ruff's default rule set plus import sorting; where a rule is wrong for one line, that line says why.
extend-select = ["I"]
