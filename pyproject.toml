[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-outbox"
version = "0.1.0"
description = "The Outbox for Orchestra: drafts that machines write and the owner approves before anything is sent as the owner, with per-kind autonomy, per-recipient limits, senders per system and a metadata-only audit on the bus."
requires-python = ">=3.12"
# orchestra: ours is 1.0.0a1; <1.0.0 keeps out the unrelated `orchestra` on PyPI (1.0.0 and up)
dependencies = ["orchestra>=1.0.0a1,<1.0.0", "fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.entry-points."orchestra.plugins"]
outbox = "orchestra_outbox.plugin:plugin"

[project.entry-points."orchestra.commands"]
outbox = "orchestra_outbox.check:main"

[tool.uv.sources]
# This repository's own environment takes Orchestra from GitHub (README, "Developing against a local Orchestra");
# ignored when the plugin is installed as a dependency.
orchestra = { git = "https://github.com/danroblewis/orchestra", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["orchestra_outbox"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests"]          # the tests import conftest and the fakes

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ruff's default rule set plus import sorting; where a rule is wrong for one line, that line says why.
extend-select = ["I"]
